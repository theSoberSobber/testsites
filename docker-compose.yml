services:
  testsites:
    build: .
    image: testsites:latest
    container_name: testsites
    restart: unless-stopped
    # no published ports and no egress: reachable only by cloudflared
    networks:
      - internal
    volumes:
      - /var/log/testsites:/var/log/testsites
    environment:
      LOG_DIR: /var/log/testsites
      MAX_BYTES: "67108864"
      KEEP_ARCHIVES: "20"
      INTERVAL: "10"
      MIN_FREE_MB: "1024"
      MAX_ARCHIVE_MB: "2048"
      MAX_STREAM_MB: "256"
      DL_RATE_MBPS: "16"
      HEALTH_TOKEN: ${HEALTH_TOKEN:?set HEALTH_TOKEN in .env}
      PYTHONDONTWRITEBYTECODE: "1"
    user: "1001:1001"
    read_only: true
    tmpfs:
      - /tmp
      - /run
      - /service/testsites/supervise:uid=1001,gid=1001
      - /service/testsites/log/supervise:uid=1001,gid=1001
      - /service/accesslog-rotate/supervise:uid=1001,gid=1001
      - /service/accesslog-rotate/log/supervise:uid=1001,gid=1001
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 256
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request;urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8080/health',headers={'Host':'testsites.1110777.xyz'}),timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  tunnel:
    image: cloudflare/cloudflared:latest
    container_name: testsites-tunnel
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--config", "/etc/cloudflared/config.yml", "run"]
    volumes:
      - /opt/testsites-tunnel:/etc/cloudflared:ro
    networks:
      - internal
      - egress
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      testsites:
        condition: service_healthy

networks:
  internal:
    name: testsites-net
    internal: true      # app cannot reach the LAN or the internet
  egress: {}            # only cloudflared gets a route out
